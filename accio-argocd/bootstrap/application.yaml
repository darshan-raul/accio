apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: accio-infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: accio-platform
  source:
    repoURL: https://github.com/myuser/accio.git # Placeholder, user should update
    targetRevision: HEAD
    path: accio-crossplane
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
